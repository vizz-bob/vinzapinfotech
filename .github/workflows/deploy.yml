name: 🚀 Vinzap CI/CD — Build, Test & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: vinzapinfotech.com
  CLOUDFRONT_DISTRIBUTION_ID: E3LBDJFANT9F4V
  SITE_URL: https://www.vinzapinfotech.com

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: BUILD & MINIFY ALL HTML
  # ─────────────────────────────────────────────

  build:
    name: 🏗️ Build & Minify HTML
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install minifier
        run: npm install -g html-minifier-terser

      - name: 📁 Create build directory
        run: mkdir -p build/blog

      - name: 🗜️ Minify root HTML files
        run: |
          for file in *.html; do
            echo "→ Minifying $file"
            html-minifier-terser \
              --collapse-whitespace \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --use-short-doctype \
              --minify-css true \
              "$file" -o "build/$file" || cp "$file" "build/$file"
          done

      - name: 🗜️ Minify blog HTML files
        run: |
          if [ -d "blog" ]; then
            for file in blog/*.html; do
              fname=$(basename "$file")
              echo "→ Minifying blog/$fname"
              html-minifier-terser \
                --collapse-whitespace \
                --minify-css true \
                "$file" -o "build/blog/$fname" || cp "$file" "build/blog/$fname"
            done
          fi

      - name: 📋 Copy static files (sitemap, robots, ads.txt)
        run: |
          cp sitemap.xml build/ 2>/dev/null || true
          cp robots.txt build/ 2>/dev/null || true
          cp ads.txt build/ 2>/dev/null || true
          cp BingSiteAuth.xml build/ 2>/dev/null || true
          cp -r images build/ 2>/dev/null || true
          cp -r assets build/ 2>/dev/null || true

      - name: 📊 Build report
        run: |
          echo "Files in build:"
          find build/ -type f | sort
          echo ""
          echo "Total size: $(du -sh build/ | cut -f1)"

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/
          retention-days: 7


  # ─────────────────────────────────────────────
  # JOB 2: DEPLOY TO AWS S3 + CLOUDFRONT
  # ─────────────────────────────────────────────

  deploy-s3:
    name: ☁️ Deploy → S3 + CloudFront
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: production
      url: ${{ env.SITE_URL }}

    steps:
      - name: 📥 Download build
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ☁️ Upload HTML (no-cache)
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8" \
            --exclude "*" \
            --include "*.html"
          echo "✅ HTML files uploaded"

      - name: ☁️ Upload sitemap & SEO files
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=86400" \
            --exclude "*" \
            --include "*.xml" \
            --include "*.txt"
          echo "✅ SEO files uploaded"

      - name: ☁️ Upload static assets (long cache)
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public, max-age=31536000" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt"
          echo "✅ Assets uploaded"

      - name: ⚡ Invalidate CloudFront cache
        run: |
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "✅ CloudFront invalidation created: $INV_ID"
          echo "Cache clears in ~1-3 min in the background."
          echo "Check CloudFront console if needed."


  # ─────────────────────────────────────────────
  # JOB 3: PING GOOGLE + BING
  # ─────────────────────────────────────────────

  seo-ping:
    name: 📡 Ping Google & Bing
    runs-on: ubuntu-latest
    needs: deploy-s3

    steps:
      - name: 🔔 Ping Google sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=${{ env.SITE_URL }}/sitemap.xml" \
            -w "\nStatus: %{http_code}" || true
          echo "✅ Google pinged"

      - name: 🔔 Ping Bing sitemap
        run: |
          curl -s "https://www.bing.com/ping?sitemap=${{ env.SITE_URL }}/sitemap.xml" \
            -w "\nStatus: %{http_code}" || true
          echo "✅ Bing pinged"

      - name: ✅ Final summary
        run: |
          echo "════════════════════════════════════"
          echo "  🎉 DEPLOYMENT COMPLETE"
          echo "════════════════════════════════════"
          echo "  Site:    ${{ env.SITE_URL }}"
          echo "  Commit:  ${{ github.sha }}"
          echo "  Time:    $(date)"
          echo "════════════════════════════════════"
